name: Tab S7 Terracotta KernelSU Build

on:
  workflow_dispatch: # 깃허브 웹 Actions 탭에서 수동으로 빌드 버튼을 누를 때 실행

jobs:
  kernel-build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 러너 디스크 공간 강제 확보 (용량 부족 방지)
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        df -h

    - name: 2. 빌드 필수 패키지 및 크로스 컴파일러(GCC) 설치
      run: |
        sudo apt update
        sudo apt install -y bc build-essential libncurses5-dev libssl-dev xz-utils binutils git ccache clang lld libelf-dev bison flex gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

    - name: 3. 커널 소스 다운로드 (현재 레포지토리 체크아웃)
      uses: actions/checkout@v4
      with:
        fetch-depth: 1 # 용량 절약을 위해 최신 커밋만 땡겨옴

    - name: 4. AOSP Clang 툴체인 다운로드 (커널 4.19 호환 r522817 계열)
      run: |
        mkdir -p $GITHUB_WORKSPACE/clang
        cd $GITHUB_WORKSPACE/clang
        wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz
        tar -xf clang-r522817.tar.gz
        rm -f clang-r522817.tar.gz

    - name: 5. KernelSU(또는 KernelSU-Next) 자동 주입 및 동기화
      run: |
        # 커널 소스 루트 폴더에서 KernelSU 환경 구성
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
        
        # 만약 KernelSU-Next를 원한다면 아래 주석을 풀고 위 라인을 주석 처리해줘
        # curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next

    - name: 6. 디바이스 defconfig 설정 튜닝 (KernelSU 및 Permissive 활성화)
      run: |
        # 억까를 피하기 위해 조각 config(.config)를 제외하고 진짜 '_defconfig'로 끝나는 파일만 매칭
        # 그 중 gts7l 문자열이 들어간 첫 번째 순수 오리지널 파일 경로를 확보
        REAL_DEFCONFIG=$(find arch/arm64/configs/ -name "*gts7l*_defconfig" | head -n 1)
        
        # 만약 vendor/ 폴더 구조 하위에 숨어있다면 그것까지 재탐색
        if [ -z "$REAL_DEFCONFIG" ]; then
          REAL_DEFCONFIG=$(find arch/arm64/configs/ -name "*gts7l*" | grep "_defconfig" | head -n 1)
        fi
        
        if [ -z "$REAL_DEFCONFIG" ]; then
          echo "ERROR: gts7l 관련 _defconfig 파일을 소스 트리에서 찾을 수 없습니다!"
          ls -R arch/arm64/configs/
          exit 1
        fi
        
        echo "최종 타겟팅 defconfig 파일 경로: $REAL_DEFCONFIG"
        
        # KernelSU 구동을 위한 필수 커널 옵션 강제 주입
        echo "CONFIG_KSU=y" >> "$REAL_DEFCONFIG"
        echo "CONFIG_OVERLAY_FS=y" >> "$REAL_DEFCONFIG"
        
        # One UI 8.x 부팅 억까 방지를 위한 SELinux Permissive 강제 주입
        echo "CONFIG_SECURITY_SELINUX_DEVELOP=y" >> "$REAL_DEFCONFIG"

    - name: 7. 대망의 커널 컴파일 (스냅드래곤 865 타겟)
      run: |
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CC=clang
        export CLANG_TRIPLE=aarch64-linux-gnu-
        
        # 파이프 브레이크 오류 및 파일명 꼬임 방지를 위한 정밀 이름 추출
        # arch/arm64/configs/ 경로 부분을 잘라내고 순수 파일명(혹은 하위 경로)만 타겟팅
        DEFCONFIG_NAME=$(find arch/arm64/configs/ -name "*gts7l*" | grep "_defconfig" | head -n 1 | sed 's|arch/arm64/configs/||')
        
        echo "최종 컴파일 로드 타겟 defconfig: $DEFCONFIG_NAME"
        
        # 동적으로 매칭 완료된 확실한 _defconfig 로드
        make "$DEFCONFIG_NAME"
        
        # 가상 머신 사양에 맞춰 2코어로 안전하게 컴파일 수행
        make -j2

    - name: 8. 빌드 완료된 커널 아티팩트 업로드
      uses: actions/upload-artifact@v4
      with:
        name: Terracotta-KernelSU-Image
        path: |
          arch/arm64/boot/Image.gz
          arch/arm64/boot/Image
