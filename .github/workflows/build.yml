name: Tab S7 Terracotta KernelSU Build

on:
  workflow_dispatch: # 깃허브 웹 Actions 탭에서 수동으로 빌드 버튼을 누를 때 실행

jobs:
  kernel-build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 러너 디스크 공간 강제 확보 (용량 부족 방지)
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        df -h

    - name: 2. 빌드 필수 패키지 및 크로스 컴파일러(GCC) 설치
      run: |
        sudo apt update
        # 4.19 커널 빌드에 필수적인 aarch64 gcc/g++ 크로스 컴파일러 패키지 추가
        sudo apt install -y bc build-essential libncurses5-dev libssl-dev xz-utils binutils git ccache clang lld libelf-dev bison flex gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

    - name: 3. 커널 소스 다운로드 (현재 레포지토리 체크아웃)
      uses: actions/checkout@v4
      with:
        fetch-depth: 1 # 용량 절약을 위해 최신 커밋만 땡겨옴

    - name: 4. AOSP Clang 툴체인 다운로드 (커널 4.19 호환 r522817 계열)
      run: |
        mkdir -p $GITHUB_WORKSPACE/clang
        cd $GITHUB_WORKSPACE/clang
        wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz
        tar -xf clang-r522817.tar.gz
        rm -f clang-r522817.tar.gz

    - name: 5. KernelSU(또는 KernelSU-Next) 자동 주입 및 동기화
      run: |
        # 커널 소스 루트 폴더에서 KernelSU 환경 구성
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
        
        # 만약 KernelSU-Next를 원한다면 아래 주석을 풀고 위 라인을 주석 처리해줘
        # curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next

    - name: 6. 디바이스 defconfig 설정 튜닝 (KernelSU 및 Permissive 활성화)
      run: |
        # 공백으로 파일 꼬이는 걸 막기 위해 탭 S7 내수/유럽 기본 파일 딱 하나만 정확하게 지정
        DEFCONFIG_FILE="arch/arm64/configs/gts7l_eur_open_defconfig"
        
        # 만약 위 파일이 없으면 gts7l이 들어간 첫 번째 파일만 강제 매치
        if [ ! -f "$DEFCONFIG_FILE" ]; then
          DEFCONFIG_FILE=$(find arch/arm64/configs/ -name "*gts7l*" | head -n 1)
        fi
        
        echo "최종 타겟팅 defconfig: $DEFCONFIG_FILE"
        
        # KernelSU 구동을 위한 필수 커널 옵션 강제 주입
        echo "CONFIG_KSU=y" >> $DEFCONFIG_FILE
        echo "CONFIG_OVERLAY_FS=y" >> $DEFCONFIG_FILE
        
        # One UI 8.x 부팅 억까 방지를 위한 SELinux Permissive 강제 주입
        echo "CONFIG_SECURITY_SELINUX_DEVELOP=y" >> $DEFCONFIG_FILE

    - name: 7. 대망의 커널 컴파일 (스냅드래곤 865 타겟)
      run: |
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CC=clang
        export CLANG_TRIPLE=aarch64-linux-gnu-
        
        # defconfig 로드 단계를 수동 명시로 안전하게 수정
        make gts7l_eur_open_defconfig
        
        # 가상 머신 사양에 맞춰 2코어로 안전하게 컴파일 수행
        make -j2

    - name: 8. 빌드 완료된 커널 아티팩트 업로드
      uses: actions/upload-artifact@v4
      with:
        name: Terracotta-KernelSU-Image
        path: |
          arch/arm64/boot/Image.gz
          arch/arm64/boot/Image
