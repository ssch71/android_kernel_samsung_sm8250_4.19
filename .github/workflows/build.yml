name: Tab S7 Terracotta KernelSU Build

on:
  workflow_dispatch: # 깃허브 웹 Actions 탭에서 수동으로 빌드 버튼을 누를 때 실행

jobs:
  kernel-build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 러너 디스크 공간 강제 확보 (용량 부족 방지)
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        df -h

    - name: 2. 빌드 필수 패키지 및 크로스 컴파일러(GCC) 설치
      run: |
        sudo apt update
        sudo apt install -y bc build-essential libncurses5-dev libssl-dev xz-utils binutils git ccache clang lld libelf-dev bison flex gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

    - name: 3. 커널 소스 다운로드 (현재 레포지토리 체크아웃)
      uses: actions/checkout@v4
      with:
        fetch-depth: 1 # 용량 절약을 위해 최신 커밋만 땡겨옴

    - name: 4. AOSP Clang 툴체인 다운로드 (커널 4.19 호환 r522817 계열)
      run: |
        mkdir -p $GITHUB_WORKSPACE/clang
        cd $GITHUB_WORKSPACE/clang
        wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz
        tar -xf clang-r522817.tar.gz
        rm -f clang-r522817.tar.gz

    - name: 5. KernelSU(또는 KernelSU-Next) 자동 주입 및 동기화
      run: |
        # 커널 소스 루트 폴더에서 KernelSU 환경 구성
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main
        
        # 만약 KernelSU-Next를 원한다면 아래 주석을 풀고 위 라인을 주석 처리해줘
        # curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s next

    - name: 6. 디바이스 조각 config 설정 튜닝 (KernelSU 및 Permissive 활성화)
      run: |
        # 기기 고유의 조각 config 파일 타겟 지정 (gts7lwifi.config와 gts7l.config 둘 다 주입)
        CONFIG_DIR="arch/arm64/configs/vendor/samsung"
        
        # 두 파일이 존재하면 각각 하단에 KernelSU 및 보안 해제 옵션 강제 인젝션
        for CONFIG_FILE in "$CONFIG_DIR/gts7lwifi.config" "$CONFIG_DIR/gts7l.config"; do
          if [ -f "$CONFIG_FILE" ]; then
            echo "주입 중인 파일: $CONFIG_FILE"
            echo "CONFIG_KSU=y" >> "$CONFIG_FILE"
            echo "CONFIG_OVERLAY_FS=y" >> "$CONFIG_FILE"
            echo "CONFIG_SECURITY_SELINUX_DEVELOP=y" >> "$CONFIG_FILE"
          fi
        done

    - name: 7. 대망의 커널 컴파일 (스냅드래곤 865 믹스인 빌드)
      run: |
        export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CC=clang
        export CLANG_TRIPLE=aarch64-linux-gnu-
        
        # 1단계: 뼈대가 되는 베이스 퀄컴 스냅865 디폴트 빌드 구성 로드 (vendor/ 하위 경로 명시)
        # 소스 트리 성향에 따라 kona-sec-perf_defconfig 또는 kona_defconfig 사용
        if [ -f "arch/arm64/configs/vendor/kona-sec-perf_defconfig" ]; then
          make vendor/kona-sec-perf_defconfig
        else
          make vendor/kona_defconfig
        fi
        
        # 2단계: 탭 S7 전용 기기 믹스인 조각 설정을 빌드 트리에 강제 병합 병합
        # 와이파이 모델 프로필이 있으면 우선 적용하고, 없으면 일반 gts7l 로드
        if [ -f "arch/arm64/configs/vendor/samsung/gts7lwifi.config" ]; then
          make vendor/samsung/gts7lwifi.config
        else
          make vendor/samsung/gts7l.config
        fi
        
        # 3단계: 2코어로 안전하게 본 컴파일 수행
        make -j2

    - name: 8. 빌드 완료된 커널 아티팩트 업로드
      uses: actions/upload-artifact@v4
      with:
        name: Terracotta-KernelSU-Image
        path: |
          arch/arm64/boot/Image.gz
          arch/arm64/boot/Image
